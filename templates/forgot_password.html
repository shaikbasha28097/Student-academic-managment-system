<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password – SAMS DRK</title>
<meta name="description" content="Reset your password via OTP - Student Attendance Management System">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    margin: 0;
    background:
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
}
.container {
    background: rgba(255, 255, 255, 0.96);
    padding: 35px;
    border-radius: 12px;
    width: 380px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.35);
    text-align: center;
}
h1 { color: #e53935; font-size: 22px; margin-bottom: 5px; }
h2 { margin-bottom: 20px; font-size: 18px; color: #333; }
input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 15px;
    box-sizing: border-box;
}
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
}
.action-btn {
    background: #2196F3;
    color: #fff;
    margin-bottom: 10px;
}
.action-btn:hover {
    background: #0b7dda;
}
.back-btn {
    background: #e0e0e0;
    color: #333;
}
.back-btn:hover {
    background: #bdbdbd;
}
.msg {
    color: #d32f2f;
    margin-bottom: 15px;
    font-weight: 600;
    font-size: 14px;
    text-align: center;
}
@media(max-width:768px){
    body{ padding:15px; box-sizing:border-box; }
    .container{ width:100%; max-width:420px; padding:25px 15px; box-sizing:border-box; }
    h1{ font-size:18px; }
    h2{ font-size:16px; }
    input, select{ font-size:15px; padding:11px; }
    button{ font-size:15px; padding:13px; }
}
</style>

</head>
<body class="sams-layout">
<div class="container">
    <h1>SAMS Password Recovery</h1>
    <h2>Reset Password</h2>

    {% if msg %}
    <div class="msg">{{ msg }}</div>
    {% endif %}

    {% if step == 1 %}
    <!-- STEP 1: Request OTP -->
    <form action="{{ url_for('forgot_password') }}" method="POST">
        <select name="role" required>
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
        </select>
        <input type="text" name="user_id" placeholder="Student/Faculty ID" required>
        <input type="text" name="contact" placeholder="Registered Email OR Phone" required>
        
        <button type="submit" name="send_otp" class="action-btn">Send OTP</button>
    </form>
    
    {% elif step == 2 %}
    <!-- STEP 2: Verify OTP -->
    <form action="{{ url_for('forgot_password') }}" method="POST">
        <input type="hidden" name="user_id" value="{{ user_id }}">
        <input type="hidden" name="role" value="{{ request.form.role }}">
        <input type="text" name="otp" placeholder="Enter 6-Digit OTP" required>
        
        <button type="submit" name="verify_otp" class="action-btn">Verify OTP</button>
    </form>
    
    {% elif step == 3 %}
    <!-- STEP 3: Reset Password -->
    <form action="{{ url_for('forgot_password') }}" method="POST">
        <input type="password" name="new_password" placeholder="Enter New Password (min 6 chars)" required>
        
        <button type="submit" name="reset_password" class="action-btn">Reset Password</button>
    </form>
    {% endif %}

    <div style="margin-top: 15px;">
        <a href="{{ url_for('login') }}"><button type="button" class="back-btn">Back to Login</button></a>
    </div>
</div>
</div>
<script src="/static/ux.js"></script>
</body>
</html>
